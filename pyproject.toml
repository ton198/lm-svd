[project]
name = "lm-svd"
version = "0.1.0"
description = "Local GPT-2 matrix experiments and streaming NeuralSVD analysis"
readme = "README.md"
authors = [
    { name = "Tony Li", email = "ton20060624@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
lm-svd = "lm_svd:main"
data-pipline = "data_pipline.cli:main"
exp1 = "experiments.exp1_L_M_table.cli:main"
exp2 = "experiments.exp2_PFH.cli:main"
exp3 = "experiments.exp3_L_M_diff.cli:main"
exp4 = "experiments.exp4_neural_svd.cli:main"
exp5 = "experiments.exp5_L_M_neural_svd.cli:main"
exp6 = "experiments.exp6_stream_gpt2_mlp.cli:main"
exp7 = "experiments.exp7_stream_transformer.cli:main"
exp8 = "experiments.exp8_stream_token_mlp.cli:main"
exp9 = "experiments.exp9_stream_sentence_mlp.cli:main"
exp10 = "experiments.exp10_stream_sentence_mlp_joint.cli:main"
lingen = "experiments.lingen.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["lm_svd", "data_pipline", "utils", "experiments"]
